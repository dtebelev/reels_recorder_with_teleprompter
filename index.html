<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Reels Teleprompter</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="theme-color" content="#0b0b0c" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main id="app">
    <!-- Screens are rendered here by js/app.js -->
  </main>
  <script>
    // Temporary diagnostic: surface otherwise-invisible errors (e.g. a
    // module failing to load/execute) directly on screen, since a remote
    // tester usually can't see the browser console. Safe to remove once
    // on-device QA is done.
    function showFatalError(label, detail) {
      var el = document.getElementById('app');
      if (el) {
        el.innerHTML = '<div style="padding:20px;color:#fff;background:#b00020;height:100%;overflow:auto;font-family:monospace;white-space:pre-wrap;">' +
          '<b>' + label + '</b>\n\n' + (detail || '') + '</div>';
      }
    }
    window.addEventListener('error', function (e) {
      showFatalError('JS error', (e.message || '') + '\n' + (e.filename ? e.filename + ':' + e.lineno + ':' + e.colno : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      showFatalError('Unhandled promise rejection', String(e.reason && e.reason.stack || e.reason));
    });
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
